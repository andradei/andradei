name: Fix repo metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Set topics and homepage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- topics ---"
          curl -sS -w '\nHTTP %{http_code}\n' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/andradei/andradei/topics \
            -d '{"names":["agentic-ai","devops","docker","golang","linux","profile-readme","python","react","typescript"]}'
          echo "--- homepage ---"
          curl -sS -w '\nHTTP %{http_code}\n' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/andradei/andradei \
            -d '{"homepage":"https://andradei.com"}'
          echo "--- token scopes ---"
          curl -sS -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/andradei/andradei
