name: Fix repo metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(curl -sS -w ' HTTP:%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/andradei/andradei/topics \
            -d '{"names":["agentic-ai","devops","docker","golang","linux","profile-readme","python","react","typescript"]}')
          echo "::notice title=topics::${out:0:600}"
          out2=$(curl -sS -w ' HTTP:%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/andradei/andradei \
            -d '{"homepage":"https://andradei.com"}')
          echo "::notice title=homepage::${out2:0:600}"
          echo "::notice title=token-check::$(curl -sS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit | head -c 300)"
