name: Fix repo metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### topics"
            curl -sS -w '\nHTTP %{http_code}\n' -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/andradei/andradei/topics \
              -d '{"names":["agentic-ai","devops","docker","golang","linux","profile-readme","python","react","typescript"]}'
            echo "### homepage"
            curl -sS -w '\nHTTP %{http_code}\n' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/andradei/andradei \
              -d '{"homepage":"https://andradei.com"}'
          } > report.txt 2>&1
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.txt
          git commit -m "metadata fix report" || true
          git push origin HEAD:main
